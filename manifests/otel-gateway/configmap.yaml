apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway
  namespace: <TEMPO_NAMESPACE>
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/otel/tls/tls.crt
              key_file: /etc/otel/tls/tls.key
              client_ca_file: /etc/otel/tls/ca.crt
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /etc/otel/tls/tls.crt
              key_file: /etc/otel/tls/tls.key
              client_ca_file: /etc/otel/tls/ca.crt
      otlp/plaintext:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
        spike_limit_mib: 192
      attributes/redact:
        actions:
        - key: http.request.header.authorization
          action: delete
        - key: http.request.header.cookie
          action: delete
        - key: db.statement
          action: delete
        - key: url.query
          action: delete
      transform/redact-url-query:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
      batch:
        timeout: 1s
        send_batch_size: 512
        send_batch_max_size: 1024
    exporters:
      otlp/tempo:
        endpoint: tempo-distributor.<TEMPO_NAMESPACE>.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 8
          queue_size: 2048
    service:
      extensions:
      - health_check
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      pipelines:
        traces:
          receivers:
          - otlp
          - otlp/plaintext
          processors:
          - memory_limiter
          - attributes/redact
          - transform/redact-url-query
          - batch
          exporters:
          - otlp/tempo

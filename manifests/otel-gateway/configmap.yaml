apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway
  namespace: <TEMPO_NAMESPACE>
data:
  config.yaml: "extensions:\n  health_check:\n    endpoint: 0.0.0.0:13133\nreceivers:\n\
    \  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n      \
    \  tls:\n          cert_file: /etc/otel/tls/tls.crt\n          key_file: /etc/otel/tls/tls.key\n\
    \          client_ca_file: /etc/otel/tls/ca.crt\n      http:\n        endpoint:\
    \ 0.0.0.0:4318\n        tls:\n          cert_file: /etc/otel/tls/tls.crt\n   \
    \       key_file: /etc/otel/tls/tls.key\n          client_ca_file: /etc/otel/tls/ca.crt\n\
    processors:\n  memory_limiter:\n    check_interval: 1s\n    limit_mib: 768\n \
    \   spike_limit_mib: 192\n  attributes/redact:\n    actions:\n    - key: http.request.header.authorization\n\
    \      action: delete\n    - key: http.request.header.cookie\n      action: delete\n\
    \    - key: db.statement\n      action: delete\n    - key: url.query\n      action:\
    \ delete\n  batch:\n    timeout: 1s\n    send_batch_size: 512\n    send_batch_max_size:\
    \ 1024\nexporters:\n  otlp/tempo:\n    endpoint: tempo-distributor.<TEMPO_NAMESPACE>.svc.cluster.local:4317\n\
    \    tls:\n      insecure: true\n    retry_on_failure:\n      enabled: true\n\
    \      initial_interval: 1s\n      max_interval: 30s\n      max_elapsed_time:\
    \ 300s\n    sending_queue:\n      enabled: true\n      num_consumers: 8\n    \
    \  queue_size: 2048\nservice:\n  extensions:\n  - health_check\n  telemetry:\n\
    \    metrics:\n      readers:\n      - pull:\n          exporter:\n          \
    \  prometheus:\n              host: 0.0.0.0\n              port: 8888\n  pipelines:\n\
    \    traces:\n      receivers:\n      - otlp\n      processors:\n      - memory_limiter\n\
    \      - attributes/redact\n      - batch\n      exporters:\n      - otlp/tempo\n"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: <TEMPO_NAMESPACE>
  labels: &id001
    app.kubernetes.io/name: otel-gateway
spec:
  replicas: 3
  selector:
    matchLabels: *id001
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: otel-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: *id001
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: *id001
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.135.0
        args:
        - --config=/etc/otel/config/config.yaml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: otlp-http-plain
          containerPort: 4319
        - name: metrics
          containerPort: 8888
        - name: health
          containerPort: 13133
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /etc/otel/config
          readOnly: true
        - name: tls
          mountPath: /etc/otel/tls
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: otel-gateway
      - name: tls
        secret:
          secretName: otel-gateway-tls

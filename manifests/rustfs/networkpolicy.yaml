apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-rustfs
  namespace: <TEMPO_NAMESPACE>
  labels:
    app.kubernetes.io/name: tempo-rustfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo-rustfs
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: tempo
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: tempo-rustfs-setup
    ports:
    - protocol: TCP
      port: 9000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo-rustfs
  namespace: <TEMPO_NAMESPACE>
  labels:
    app.kubernetes.io/name: tempo-rustfs
spec:
  serviceName: tempo-rustfs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo-rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo-rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0
        command:
        - /usr/bin/rustfs
        ports:
        - name: s3
          containerPort: 9000
        - name: console
          containerPort: 9001
        env:
        # Single-node, single-drive standalone mode. The root credentials come from the same
        # Secret Tempo uses, so this RustFS is dedicated to Tempo.
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-credentials
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-credentials
              key: RUSTFS_SECRET_KEY
        - name: RUSTFS_VOLUMES
          value: /data
        - name: RUSTFS_ADDRESS
          value: :9000
        - name: RUSTFS_CONSOLE_ADDRESS
          value: :9001
        - name: RUSTFS_CONSOLE_ENABLE
          value: 'true'
        # Empty log directory sends logs to stdout (kubectl logs).
        - name: RUSTFS_OBS_LOG_DIRECTORY
          value: ''
        - name: RUSTFS_OBS_LOGGER_LEVEL
          value: warn
        - name: RUSTFS_OBS_ENVIRONMENT
          value: production
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: s3
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: s3
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: s3
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: <STORAGE_CLASS>
      resources:
        requests:
          storage: <RUSTFS_STORAGE_SIZE>

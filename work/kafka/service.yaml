apiVersion: v1
kind: Service
metadata:
  name: tempo-kafka-headless
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tempo-kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: tempo-kafka
  ports:
  - name: client
    port: 9092
    targetPort: client
  - name: controller
    port: 9093
    targetPort: controller

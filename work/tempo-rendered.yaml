      maintenance_interval: 1m
      provider:
        compaction:
          compaction:
            block_retention: 720h
            compacted_block_retention: 1h
            compaction_cycle: 30s
            compaction_window: 1h
            max_block_bytes: 107374182400
            max_compaction_objects: 6000000
            max_time_per_tenant: 5m
            retention_concurrency: 10
          max_compaction_level: 0
          max_input_blocks: 4
          max_jobs_per_tenant: 1000
          min_cycle_interval: 30s
          min_input_blocks: 2
        retention:
          interval: 1h
      work:
        dead_job_timeout: 24h
        prune_age: 1h
    backend_worker:
      backend_scheduler_addr: tempo-backend-scheduler:9095
      backoff:
        max_period: 1m
        max_retries: 0
        min_period: 100ms
      compaction:
        block_retention: 720h
        compacted_block_retention: 1h
        compaction_cycle: 30s
        compaction_window: 1h
        max_block_bytes: 107374182400
        max_compaction_objects: 6000000
        max_time_per_tenant: 5m
        retention_concurrency: 10
      finish_on_shutdown_timeout: 30s
      ring:
        kvstore:
          store: memberlist
    block_builder:
      partitions_per_instance: 1
    cache:
      caches: []
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
      ring:
        kvstore:
          store: memberlist
    ingest:
      kafka:
        address: tempo-kafka.monitoring.svc.cluster.local:9092
        auto_create_topic_default_partitions: 3
        auto_create_topic_enabled: false
        topic: tempo-traces
    live_store:
      readiness_target_lag: 5s
      ring:
        kvstore:
          store: memberlist
    memberlist:
      abort_if_cluster_join_fails: false
      bind_addr: []
      bind_port: 7946
      cluster_label: 'tempo.monitoring'
      gossip_interval: 1s
      gossip_nodes: 2
      gossip_to_dead_nodes_time: 30s
      join_members:
      - dns+tempo-gossip-ring:7946
      leave_timeout: 5s
      left_ingesters_timeout: 5m
      max_join_backoff: 1m
      max_join_retries: 10
      min_join_backoff: 1s
      node_name: ""
      packet_dial_timeout: 5s
      packet_write_timeout: 5s
      pull_push_interval: 30s
      randomize_node_name: true
      rejoin_interval: 0s
      retransmit_factor: 2
      stream_timeout: 10s
    metrics_generator:
      metrics_ingestion_time_range_slack: 30s
      processor:
        service_graphs:
          dimensions: []
          histogram_buckets:
          - 0.1
          - 0.2
          - 0.4
          - 0.8
          - 1.6
          - 3.2
          - 6.4
          - 12.8
          max_items: 10000
          wait: 10s
          workers: 10
        span_metrics:
          dimensions: []
          histogram_buckets:
          - 0.002
          - 0.004
          - 0.008
          - 0.016
          - 0.032
          - 0.064
          - 0.128
          - 0.256
          - 0.512
          - 1.02
          - 2.05
          - 4.1
      registry:
        collection_interval: 15s
        external_labels: {}
        stale_duration: 15m
      ring:
        kvstore:
          store: memberlist
      storage:
        path: /var/tempo/wal
        remote_write:
        - send_exemplars: true
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
        remote_write_add_org_id_header: false
        remote_write_flush_deadline: 1m
        wal: null
    multitenancy_enabled: false
    overrides:
      defaults:
        metrics_generator:
          processors:
          - span-metrics
          - service-graphs
      per_tenant_override_config: /runtime-config/overrides.yaml
    querier:
      frontend_worker:
        frontend_address: tempo-query-frontend-discovery:9095
      max_concurrent_queries: 20
      search:
        query_timeout: 30s
      trace_by_id:
        query_timeout: 10s
    query_frontend:
      max_outstanding_per_tenant: 2000
      max_retries: 2
      mcp_server:
        enabled: false
      metrics:
        concurrent_jobs: 1000
        duration_slo: 0s
        interval: 5m
        max_duration: 3h
        query_backend_after: 15m
        target_bytes_per_job: 104857600
        throughput_bytes_slo: 0
      search:
        concurrent_jobs: 1000
        max_spans_per_span_set: 100
        target_bytes_per_job: 104857600
      trace_by_id:
        query_shards: 50
    server:
      grpc_server_max_recv_msg_size: 4194304
      grpc_server_max_send_msg_size: 4194304
      http_listen_port: 3200
      http_server_read_timeout: 30s
      http_server_write_timeout: 30s
      log_format: logfmt
      log_level: info
    storage:
      trace:
        backend: s3
        blocklist_poll: 5m
        local:
          path: /var/tempo/traces
        pool:
          max_workers: 400
          queue_depth: 20000
        s3:
          access_key: ${RUSTFS_ACCESS_KEY}
          bucket: tempo-traces
          endpoint: tempo-rustfs.monitoring.svc.cluster.local:9000
          forcepathstyle: true
          insecure: true
          secret_key: ${RUSTFS_SECRET_KEY}
        search:
          prefetch_trace_count: 1000
        wal:
          path: /var/tempo/wal
    stream_over_http_enabled: false
    usage_report:
      reporting_enabled: false

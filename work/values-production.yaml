fullnameOverride: tempo
reportingEnabled: false
global:
  storageClass: local-path
  extraArgs:
  - -config.expand-env=true
  extraEnvFrom:
  - secretRef:
      name: tempo-credentials
  extraEnv:
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
defaults:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
tempo:
  image:
    registry: harbor.wintech-nano.com/external
    repository: grafana/tempo
    tag: 3.1.0
  useHeadlessGoverningService: true
  startupProbe:
    httpGet:
      path: /ready
      port: http-metrics
    periodSeconds: 10
    failureThreshold: 180
  structuredConfig:
    multitenancy_enabled: false
    memberlist:
      advertise_addr: ${POD_IP}
serviceAccount:
  create: true
  automountServiceAccountToken: false
ingest:
  kafka:
    address: tempo-kafka.monitoring.svc.cluster.local:9092
    topic: tempo-traces
    auto_create_topic_enabled: false
    auto_create_topic_default_partitions: 3
traces:
  otlp:
    grpc:
      enabled: true
storage:
  trace:
    backend: s3
    s3:
      endpoint: tempo-rustfs.monitoring.svc.cluster.local:9000
      bucket: tempo-traces
      access_key: ${RUSTFS_ACCESS_KEY}
      secret_key: ${RUSTFS_SECRET_KEY}
      insecure: true
      forcepathstyle: true
metricsGenerator:
  enabled: true
  kind: StatefulSet
  replicas: 2
  persistence:
    enabled: true
    size: 20Gi
  config:
    storage:
      remote_write_add_org_id_header: false
      remote_write:
      - url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
        send_exemplars: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
backendScheduler:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  config:
    provider:
      compaction:
        compaction:
          block_retention: 720h
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
backendWorker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
blockBuilder:
  replicas: 3
  config:
    partitions_per_instance: 1
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '4'
      memory: 4Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
liveStore:
  replicas: 3
  persistence:
    enabled: true
    size: 30Gi
  config:
    readiness_target_lag: 5s
  zoneAwareReplication:
    enabled: false
    noDownscale: false
  resources:
    requests:
      cpu: '1'
      memory: 4Gi
    limits:
      cpu: '4'
      memory: 8Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
distributor:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
querier:
  replicas: 2
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '4'
      memory: 4Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
queryFrontend:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
rollout_operator:
  enabled: false
  image:
    tag: v0.40.0
memcached:
  enabled: false
cache:
  caches: []
gateway:
  enabled: false
overrides:
  defaults:
    metrics_generator:
      processors:
      - span-metrics
      - service-graphs
metaMonitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
